name: Build Geode Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-customizer
          path: build/*.geode
